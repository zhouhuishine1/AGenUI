plugins { id("com.android.application"); id("com.facebook.react") }

react { autolinkLibrariesWithApp() }

repositories {
    maven { url = uri("../../flutter_pet/build/host/outputs/repo") }
    maven { url = uri("https://storage.googleapis.com/download.flutter.io") }
}

android {
    namespace "com.amap.agenuirndemo"
    compileSdk 35
    sourceSets { main { assets.srcDir("../../contents") } }
    defaultConfig { applicationId "com.amap.agenuirndemo"; minSdk 24; targetSdk 35; versionCode 1; versionName "1.0" }
    buildTypes { release { signingConfig signingConfigs.debug } }
}

dependencies {
    debugImplementation("com.amap.flutter_pet:flutter_debug:1.0")
    releaseImplementation("com.amap.flutter_pet:flutter_release:1.0")
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation(project(":agenui-sdk"))
    implementation("io.github.sheng93:fluid-markdown:1.0.3")
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("com.google.android.material:material:1.12.0")
}
